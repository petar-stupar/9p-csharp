- markdown: >-
    The numeric uid when one is known; <xref href="NineP.Protocol.Constants.NONUNAME" data-throw-if-not-resolved="false"></xref> otherwise. The wire

    sentinel rather than a nullable, as for every optional id (workspace architecture §12).
- code: public uint Uid { get; init; }

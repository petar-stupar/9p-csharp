- api3: IsAuthenticated
  id: NineP_Protocol_Auth_Identity_IsAuthenticated
  metadata:
    uid: NineP.Protocol.Auth.Identity.IsAuthenticated
    commentId: P:NineP.Protocol.Auth.Identity.IsAuthenticated
- markdown: >-
    False when nothing was proved and <xref href="NineP.Protocol.Auth.Identity.User" data-throw-if-not-resolved="false"></xref> is only what the client claimed — the

    identity of a <code>Tattach</code> with <code>afid = NOFID</code>. A filesystem that scopes anything by

    the user name must read this first: a server that allows unauthenticated attaches at all

    will otherwise hand out a named user's tree to whoever asks for it by name. Only

    <xref href="NineP.Protocol.Auth.Identity.Anonymous(System.String%2cSystem.UInt32)" data-throw-if-not-resolved="false"></xref> produces false, so an identity an authenticator built is

    authenticated by construction.
- code: public bool IsAuthenticated { get; }

- markdown: >-
    Who a session runs as. It is produced by the authenticator and never by the client's claim

    (workspace architecture §5): a <code>Tattach</code> may say any <code>uname</code> it likes, and the server

    still runs the session as whoever the afid exchange proved.
- code: 'public sealed record Identity : IEquatable<Identity>'

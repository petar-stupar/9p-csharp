- api3: MaxAuthFailuresPerAddress
  id: NineP_Protocol_Limits_MaxAuthFailuresPerAddress
  src: https://github.com/petar-stupar/9p-csharp/blob/main/src/NineP.Protocol/Limits.cs#L83
  metadata:
    uid: NineP.Protocol.Limits.MaxAuthFailuresPerAddress
    commentId: P:NineP.Protocol.Limits.MaxAuthFailuresPerAddress
- markdown: >-
    Authentications one peer address may begin inside <xref href="NineP.Protocol.Limits.AuthFailureWindow" data-throw-if-not-resolved="false"></xref> without

    one of them reaching a successful attach, before its <code>Tauth</code> is refused without asking

    the authenticator at all; 0 disables the budget. A successful attach clears the address, so

    what this bounds is failed and abandoned exchanges. The default is generous enough for a

    client that opens several attaches at once — v9fs <code>access=user</code> does — and still

    leaves a guesser paying for nothing. Default 32.
- code: public int MaxAuthFailuresPerAddress { get; init; }
- h4: Property Value
- parameters:
  - type:
    - text: int
      url: https://learn.microsoft.com/dotnet/api/system.int32
- api3: MaxConnectionsPerAddress
  id: NineP_Protocol_Limits_MaxConnectionsPerAddress
  src: https://github.com/petar-stupar/9p-csharp/blob/main/src/NineP.Protocol/Limits.cs#L58
  metadata:
    uid: NineP.Protocol.Limits.MaxConnectionsPerAddress
    commentId: P:NineP.Protocol.Limits.MaxConnectionsPerAddress
- markdown: >-
    Live connections one peer address may hold; 0 disables the cap. It bounds the share of

    <xref href="NineP.Protocol.Limits.MaxConnectionsPerListener" data-throw-if-not-resolved="false"></xref> a single host can take, so a flood from one

    machine cannot lock every other client out. Unlike the listener cap, which leaves an

    excess connection in the kernel's backlog, an excess connection here is accepted (the

    address is not known before that) and then closed at once. Default 64.
- code: public int MaxConnectionsPerAddress { get; init; }
- h4: Property Value
- parameters:
  - type:
    - text: int
      url: https://learn.microsoft.com/dotnet/api/system.int32

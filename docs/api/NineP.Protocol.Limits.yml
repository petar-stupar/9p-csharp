- api3: MaxRequestsPerSecondPerConnection
  id: NineP_Protocol_Limits_MaxRequestsPerSecondPerConnection
  src: https://github.com/petar-stupar/9p-csharp/blob/main/src/NineP.Protocol/Limits.cs#L67
  metadata:
    uid: NineP.Protocol.Limits.MaxRequestsPerSecondPerConnection
    commentId: P:NineP.Protocol.Limits.MaxRequestsPerSecondPerConnection
- markdown: >-
    Ordinary requests per second one connection may sustain; 0 disables metering, which is the

    default because only the operator knows what a request costs their handler. The burst is

    the connection's own in-flight budget, so a client inside its window is never refused for

    the rate. Excess requests are answered EAGAIN at once; <code>Tflush</code> and <code>Tversion</code>

    are never metered. Default 0.
- code: public int MaxRequestsPerSecondPerConnection { get; init; }
- h4: Property Value
- parameters:
  - type:
    - text: int
      url: https://learn.microsoft.com/dotnet/api/system.int32
- api3: MaxRequestsPerSecondPerListener
  id: NineP_Protocol_Limits_MaxRequestsPerSecondPerListener
  src: https://github.com/petar-stupar/9p-csharp/blob/main/src/NineP.Protocol/Limits.cs#L73
  metadata:
    uid: NineP.Protocol.Limits.MaxRequestsPerSecondPerListener
    commentId: P:NineP.Protocol.Limits.MaxRequestsPerSecondPerListener
- markdown: >-
    Ordinary requests per second across every connection of one listener; 0 disables metering.

    Default 0.
- code: public int MaxRequestsPerSecondPerListener { get; init; }
- h4: Property Value
- parameters:
  - type:
    - text: int
      url: https://learn.microsoft.com/dotnet/api/system.int32

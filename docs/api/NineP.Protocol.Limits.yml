  metadata:
    uid: NineP.Protocol.Limits.PreNegotiationFrameCap
    commentId: P:NineP.Protocol.Limits.PreNegotiationFrameCap
- markdown: >-
    The frame cap that applies until <code>Tversion</code> has been answered. It is a small constant,

    never the configured maximum: an unauthenticated peer must not be able to make a connection

    reserve a megabyte by lying in the size field. Default 8192.

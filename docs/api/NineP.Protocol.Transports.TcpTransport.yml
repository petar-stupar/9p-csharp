metadata:
  description: >-
    TCP with TCP_NODELAY and keep-alive on, an accept backlog and a per-listener connection

    cap. The cap stops accepting: a connection over the limit waits in the kernel's backlog

    and is served when a slot frees, rather than being accepted and reset, which a client cannot

    tell from a crash.

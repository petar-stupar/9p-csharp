- api3: MaxMessageSize
  id: NineP_Protocol_Transports_WebSocketTransportOptions_MaxMessageSize
  metadata:
    uid: NineP.Protocol.Transports.WebSocketTransportOptions.MaxMessageSize
    commentId: P:NineP.Protocol.Transports.WebSocketTransportOptions.MaxMessageSize
- markdown: >-
    The largest message accepted, enforced <b>during</b> accumulation rather than at the end:

    a peer must not be able to make the server buffer a gigabyte before it is refused. Over the

    cap the socket closes 1009. Default 1 MiB.
- code: public int MaxMessageSize { get; init; }

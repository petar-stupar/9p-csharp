- code: 'public enum LockType : byte'
- h2: Fields
- parameters:
  - name: ReadLock
    default: "0"
    description: >+
      A shared read lock.

  - name: Unlock
    default: "2"
    description: >+
      Release a lock; as a <code>Rgetlock</code> answer it means "no conflicting lock".

  - name: WriteLock
    default: "1"
    description: >+
      An exclusive write lock.


- api3: ListeningAsync(CancellationToken)
  id: NineP_Server_NinePServer_ListeningAsync_System_Threading_CancellationToken_
  src: https://github.com/petar-stupar/9p-csharp/blob/errors/linux-table/src/NineP.Server/NinePServer.cs#L74
  metadata:
    uid: NineP.Server.NinePServer.ListeningAsync(System.Threading.CancellationToken)
    commentId: M:NineP.Server.NinePServer.ListeningAsync(System.Threading.CancellationToken)
- markdown: >-
    Waits until every configured address is bound, after which <xref href="NineP.Server.NinePServer.Endpoints" data-throw-if-not-resolved="false"></xref> carries

    the real ports. <xref href="NineP.Server.NinePServer.ServeAsync(NineP.Server.IFilesystem%2cSystem.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref> runs until the server stops, so a caller that wants

    the bound address starts it, awaits this, and reads <xref href="NineP.Server.NinePServer.Endpoints" data-throw-if-not-resolved="false"></xref>.
- code: public ValueTask ListeningAsync(CancellationToken cancellationToken = default)
- h4: Parameters
- parameters:
  - name: cancellationToken
    type:
    - text: CancellationToken
      url: https://learn.microsoft.com/dotnet/api/system.threading.cancellationtoken
    description: Stops waiting; the server is unaffected.
    optional: true
- h4: Returns
- parameters:
  - type:
    - text: ValueTask
      url: https://learn.microsoft.com/dotnet/api/system.threading.tasks.valuetask
    description: A task that completes when every listener is bound.
- h4: Exceptions
- parameters:
  - type:
    - text: ArgumentException
      url: https://learn.microsoft.com/dotnet/api/system.argumentexception
    description: A configured address could not be bound.

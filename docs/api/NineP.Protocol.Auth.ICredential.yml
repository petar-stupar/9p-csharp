    commentId: M:NineP.Protocol.Auth.ICredential.AuthenticateAsync(NineP.Protocol.Auth.IAuthChannel,System.Threading.CancellationToken)
- markdown: Runs the client half of the exchange over the afid.
- code: ValueTask AuthenticateAsync(IAuthChannel channel, CancellationToken cancellationToken = default)
- h4: Parameters
- parameters:
  - name: channel
    type:
    - text: IAuthChannel
      url: NineP.Protocol.Auth.IAuthChannel.html
    description: The afid, as a read/write pair.
  - name: cancellationToken
    type:
    - text: CancellationToken
      url: https://learn.microsoft.com/dotnet/api/system.threading.cancellationtoken
    description: Cancels the exchange.
    optional: true
- h4: Returns
- parameters:
  - type:
    - text: ValueTask
      url: https://learn.microsoft.com/dotnet/api/system.threading.tasks.valuetask
    description: A task that completes when the exchange has succeeded.
- h4: Exceptions
- parameters:
  - type:
    - text: NinePException
      url: NineP.Protocol.NinePException.html
    description: The server refused the credential.

- markdown: >-
    Client-side credential: it drives the afid exchange from inside <code>AttachAsync</code>, so a caller

    never writes protocol code to authenticate (workspace architecture §5).
- code: public interface ICredential
- h2: Methods
- api3: AuthenticateAsync(IAuthChannel, CancellationToken)
  id: NineP_Protocol_Auth_ICredential_AuthenticateAsync_NineP_Protocol_Auth_IAuthChannel_System_Threading_CancellationToken_

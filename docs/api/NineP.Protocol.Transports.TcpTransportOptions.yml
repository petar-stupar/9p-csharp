- markdown: >-
    Where a transient accept failure is reported; <xref href="Microsoft.Extensions.Logging.Abstractions.NullLogger.Instance" data-throw-if-not-resolved="false"></xref> when null. An

    accept that fails and is retried is the one thing this transport has to say, and a

    listener that says nothing about it hides a machine running out of descriptors.

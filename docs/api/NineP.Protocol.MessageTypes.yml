    uid: NineP.Protocol.MessageTypes.IsRequest(NineP.Protocol.MessageType)
    commentId: M:NineP.Protocol.MessageTypes.IsRequest(NineP.Protocol.MessageType)
- markdown: >-
    True for a request type, false for a reply. <code>Terror</code> and <code>Tlerror</code> are neither:

    they are declared so that the numbers are accounted for, and they never reach the wire.
- code: public static bool IsRequest(MessageType type)

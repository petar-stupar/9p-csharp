- api3: IsRequest(MessageType)
  id: NineP_Protocol_MessageTypes_IsRequest_NineP_Protocol_MessageType_
  src: https://github.com/petar-stupar/9p-csharp/blob/errors/linux-table/src/NineP.Protocol/MessageTypes.cs#L31

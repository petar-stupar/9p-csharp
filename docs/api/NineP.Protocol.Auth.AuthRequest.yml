- markdown: >-
    The triple a <code>Tauth</code> binds an afid to (reference §5.2, S-22). Binding on

    <code>uname</code> and <code>aname</code> alone would let an afid opened for one numeric user satisfy an

    attach claiming another in a .u or .L session.

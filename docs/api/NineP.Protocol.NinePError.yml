    commentId: P:NineP.Protocol.NinePError.TruncatedEname
- markdown: >-
    The ename truncated to <code>ERRMAX - 1</code> bytes on a UTF-8 rune boundary, so a long error

    never overruns the conventional cap and never splits a character (reference §8 rule 10).

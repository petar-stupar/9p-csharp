- markdown: >-
    Default authentication: the client writes an opaque token to the afid once, the server compares

    it in constant time and answers <code>ok\n</code> (workspace architecture §5). Plan 9's

    <code>p9any</code>/<code>p9sk1</code> is deliberately out of scope: it is DES-based and is not production

    security.

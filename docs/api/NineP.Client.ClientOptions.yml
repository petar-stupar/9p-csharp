- api3: DisposeTimeout
  id: NineP_Client_ClientOptions_DisposeTimeout
  src: https://github.com/petar-stupar/9p-csharp/blob/main/src/NineP.Client/ClientOptions.cs#L70
  metadata:
    uid: NineP.Client.ClientOptions.DisposeTimeout
    commentId: P:NineP.Client.ClientOptions.DisposeTimeout
- markdown: >-
    How long <xref href="NineP.Client.NinePSession.DisposeAsync" data-throw-if-not-resolved="false"></xref> may spend clunking the fids that are

    still open, in total rather than per fid. Default 5 s. The clunks are issued together and

    the effective bound is the smaller of this and <xref href="NineP.Client.ClientOptions.RequestTimeout" data-throw-if-not-resolved="false"></xref>; whatever has

    not been answered by then is abandoned, because closing the transport makes the server

    forget those fids anyway. Zero means no bound, as it does everywhere else here.
- code: public TimeSpan DisposeTimeout { get; init; }
- h4: Property Value
- parameters:
  - type:
    - text: TimeSpan
      url: https://learn.microsoft.com/dotnet/api/system.timespan

- api3: MinDialect
  id: NineP_Client_ClientOptions_MinDialect
  src: https://github.com/petar-stupar/9p-csharp/blob/main/src/NineP.Client/ClientOptions.cs#L35
  metadata:
    uid: NineP.Client.ClientOptions.MinDialect
    commentId: P:NineP.Client.ClientOptions.MinDialect
- markdown: >-
    The least dialect the caller accepts. It gates exactly one answer: the plain

    <code>"9P2000"</code> that version(5) lets a server give to a suffixed offer, which is the only

    downgrade there is (reference §8 rule 18). Below this floor that answer throws

    <xref href="NineP.Protocol.NinePVersionException" data-throw-if-not-resolved="false"></xref> rather than silently degrading the session. Every other

    mismatch — a dialect that is neither the one offered nor the base version, a dialect higher

    than was offered, an unknown string — is a <xref href="NineP.Protocol.NinePVersionException" data-throw-if-not-resolved="false"></xref> whatever

    this is set to; a floor of <xref href="NineP.Protocol.Dialect.P9_2000" data-throw-if-not-resolved="false"></xref> is not permission to accept

    anything at all.
- code: public Dialect MinDialect { get; init; }

- api3: VerifyAsync(string, ReadOnlyMemory<byte>, CancellationToken)
  id: NineP_Protocol_Auth_PasswordFileStore_VerifyAsync_System_String_System_ReadOnlyMemory_System_Byte__System_Threading_CancellationToken_
  src: https://github.com/petar-stupar/9p-csharp/blob/main/src/NineP.Protocol/Auth/PasswordFileStore.cs#L106
  metadata:
    uid: NineP.Protocol.Auth.PasswordFileStore.VerifyAsync(System.String,System.ReadOnlyMemory{System.Byte},System.Threading.CancellationToken)
    commentId: M:NineP.Protocol.Auth.PasswordFileStore.VerifyAsync(System.String,System.ReadOnlyMemory{System.Byte},System.Threading.CancellationToken)
- markdown: >-
    Verifies a password in constant time. "Constant" covers the unknown user too: a name the

    file does not carry is derived against a dummy credential of the same iteration count and

    compared against a dummy hash, so the answer takes the same work either way and a caller

    cannot enumerate accounts with a stopwatch. Exactly one derivation runs per call.

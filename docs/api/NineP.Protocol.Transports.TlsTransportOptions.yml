- api3: AllowInsecureCertificates
  id: NineP_Protocol_Transports_TlsTransportOptions_AllowInsecureCertificates
  metadata:
    uid: NineP.Protocol.Transports.TlsTransportOptions.AllowInsecureCertificates
    commentId: P:NineP.Protocol.Transports.TlsTransportOptions.AllowInsecureCertificates
- markdown: >-
    Disables chain and host-name verification <b>when dialling</b>, and logs a warning on every

    connect. Default false, and there is no way to reach it by accident: it is not implied by

    any other setting. It is deliberately client-side only — a listener with

    <xref href="NineP.Protocol.Transports.TlsTransportOptions.RequireClientCertificate" data-throw-if-not-resolved="false"></xref> still verifies the certificate a client presents,

    because otherwise a flag about the server's certificate would silently turn a client

    certificate into no authentication at all. A listener configured with it logs that it is

    being ignored.
- code: public bool AllowInsecureCertificates { get; init; }

- parameters:
  - name: Append
    default: "1"
    description: >+
      Append only: writes ignore the offset and OTRUNC is ignored.

  - name: Auth
    default: "8"
    description: >+
      The authentication file behind an afid.

  - name: Exclusive
    default: "2"
    description: >+
      Exclusive use: one open fid at a time.

  - name: Mount
    default: "16"
    description: >+
      A mounted channel.

  - name: None
    default: "0"
    description: >+
      No flag is set.

  - name: Temporary
    default: "4"
    description: >+
      Not backed up.


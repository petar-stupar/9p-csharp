    commentId: M:NineP.Client.NinePFid.FsyncAsync(System.Boolean,System.Threading.CancellationToken)
- markdown: >-
    Flushes the file to stable storage: <code>Tfsync</code> in .L, and in 9P2000 and .u the

    all-don't-touch <code>Twstat</code> that stat(5) defines as exactly that request.
- code: public ValueTask FsyncAsync(bool dataOnly = false, CancellationToken cancellationToken = default)
- h4: Parameters
- parameters:
  - name: dataOnly
    type:
    - text: bool
      url: https://learn.microsoft.com/dotnet/api/system.boolean
    description: >-
      True to commit data without metadata. Only <code>.L</code> has the distinction — <code>Tfsync</code>

      carries <code>datasync</code>, the all-don't-touch <code>Twstat</code> does not — so in 9P2000 and .u a

      data-only sync goes out as the full sync. That is not a dropped field: a full sync commits

      the data as well, so the weaker request is satisfied by the stronger one and nothing the

      caller asked for is left undone (reference §8 rule 16).
    optional: true
  - name: cancellationToken
    type:
    - text: CancellationToken
      url: https://learn.microsoft.com/dotnet/api/system.threading.cancellationtoken
    description: Cancels the request.
    optional: true
- h4: Returns
- parameters:
  - type:
    - text: ValueTask
      url: https://learn.microsoft.com/dotnet/api/system.threading.tasks.valuetask
    description: A task that completes when the server confirmed.

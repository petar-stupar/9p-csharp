- api3: FsyncAsync(bool, CancellationToken)
  id: NineP_Client_NinePFid_FsyncAsync_System_Boolean_System_Threading_CancellationToken_
  src: https://github.com/petar-stupar/9p-csharp/blob/main/src/NineP.Client/NinePFid.cs#L509

- markdown: Creates a file in this directory fid; the fid then refers to the new, open file.
- code: public ValueTask CreateAsync(string name, FileKind kind, FilePermissions perm, OpenMode mode, OpenFlags flags = OpenFlags.None, FileFlags fileFlags = FileFlags.None, CancellationToken cancellationToken = default)
- h4: Parameters
- parameters:
  - name: name
    type:
    - text: string
      url: https://learn.microsoft.com/dotnet/api/system.string
    description: The name to create.
  - name: kind
    type:
    - text: FileKind
      url: NineP.Protocol.FileKind.html
    description: >-
      What to create: <xref href="NineP.Protocol.FileKind.File" data-throw-if-not-resolved="false"></xref> or <xref href="NineP.Protocol.FileKind.Directory" data-throw-if-not-resolved="false"></xref>. A

      symlink is <code>SymlinkAsync</code> and a device is <code>Tmknod</code>; both carry a payload

      <code>Tcreate</code> has no room for here, so asking for one is refused rather than sent as a

      create with the payload missing (reference §8 rule 15).
  - name: perm
    type:
    - text: FilePermissions
      url: NineP.Protocol.FilePermissions.html
    description: The permission bits; the <code>07777</code> mask and nothing else.
  - name: mode
    type:
    - text: OpenMode
      url: NineP.Protocol.OpenMode.html
    description: The access mode the new fid is opened with.
  - name: flags
    type:
    - text: OpenFlags
      url: NineP.Protocol.OpenFlags.html
    description: Flags accompanying the create.
    optional: true
  - name: fileFlags
    type:
    - text: FileFlags
      url: NineP.Protocol.FileFlags.html
    description: >-
      The file flags the new file is to carry: <xref href="NineP.Protocol.FileFlags.Append" data-throw-if-not-resolved="false"></xref>,

      <xref href="NineP.Protocol.FileFlags.Exclusive" data-throw-if-not-resolved="false"></xref> and <xref href="NineP.Protocol.FileFlags.Temporary" data-throw-if-not-resolved="false"></xref> are the settable

      ones (open(2); reference §8 rule 19). 9P2000 and .u spell them in <code>Tcreate.perm</code>;

      .L has no spelling at all, so a .L create that asks for one is refused.
    optional: true
  - name: cancellationToken

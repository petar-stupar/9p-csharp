- api3: DisposeAsync()
  id: NineP_Client_NinePSession_DisposeAsync
  src: https://github.com/petar-stupar/9p-csharp/blob/main/src/NineP.Client/NinePSession.cs#L490
  metadata:
    uid: NineP.Client.NinePSession.DisposeAsync
    commentId: M:NineP.Client.NinePSession.DisposeAsync
- markdown: >-
    Clunks every outstanding fid and closes the transport. The clunks go out <b>together</b>

    and share one deadline — <xref href="NineP.Client.ClientOptions.DisposeTimeout" data-throw-if-not-resolved="false"></xref>, or

    <xref href="NineP.Client.ClientOptions.RequestTimeout" data-throw-if-not-resolved="false"></xref> when that is shorter — rather than being tried

    one after another. Sequentially, a peer that is connected but silent costs

    <code>2 × RequestTimeout</code> per fid (the clunk, then the <code>Tflush</code> that cancels it), so

    disposal grew with the number of open fids: twelve minutes at the defaults with five fids.

    Whatever the peer has not answered when the deadline passes is abandoned, which loses

    nothing: the transport close below makes the server forget every fid on the connection.


    <p>

    This never throws because the connection has already died. A peer that crashed or a socket

    closed under the writer is an ordinary way for a session to end, so a clunk that cannot be

    delivered is swallowed whether the failure arrives as a <xref href="NineP.Protocol.NinePException" data-throw-if-not-resolved="false"></xref> or as

    the transport's own <xref href="System.IO.IOException" data-throw-if-not-resolved="false"></xref>; the fids are released either way.

    </p>
- code: public ValueTask DisposeAsync()
- h4: Returns
- parameters:
  - type:
    - text: ValueTask
      url: https://learn.microsoft.com/dotnet/api/system.threading.tasks.valuetask
    description: A task that completes when the connection has closed.

- api3: RemoveXattrAsync(string, CancellationToken)
  id: NineP_Server_IXattrHandler_RemoveXattrAsync_System_String_System_Threading_CancellationToken_
  src: https://github.com/petar-stupar/9p-csharp/blob/main/src/NineP.Server/IXattrHandler.cs#L42
  metadata:
    uid: NineP.Server.IXattrHandler.RemoveXattrAsync(System.String,System.Threading.CancellationToken)
    commentId: M:NineP.Server.IXattrHandler.RemoveXattrAsync(System.String,System.Threading.CancellationToken)
- markdown: >-
    Removes one attribute. The core calls this when a <code>Txattrcreate</code> fid whose

    <code>attr_size</code> was zero is clunked: that is how v9fs and diod spell <code>removexattr(2)</code>

    on the wire, and reference §8 rule 21 makes it a removal rather than an empty value.

    Removing an attribute that is not there is not an error.

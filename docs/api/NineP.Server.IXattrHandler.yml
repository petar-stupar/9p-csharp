    commentId: M:NineP.Server.IXattrHandler.SetXattrAsync(System.String,System.ReadOnlyMemory{System.Byte},NineP.Protocol.XattrFlags,System.Threading.CancellationToken)
- markdown: >-
    Writes one attribute. The core calls this when a <code>Txattrcreate</code> fid is clunked and the

    <code>attr_size</code> it promised was non-zero; a zero-length value never reaches here, because

    that request is a removal (see <xref href="NineP.Server.IXattrHandler.RemoveXattrAsync(System.String%2cSystem.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref>).
- code: ValueTask SetXattrAsync(string name, ReadOnlyMemory<byte> value, XattrFlags flags, CancellationToken cancellationToken = default)

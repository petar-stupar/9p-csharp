    - text: ValueTask
      url: https://learn.microsoft.com/dotnet/api/system.threading.tasks.valuetask
    description: A task that completes when the attribute is gone.
- api3: SetXattrAsync(string, ReadOnlyMemory<byte>, XattrFlags, CancellationToken)
  id: NineP_Server_IXattrHandler_SetXattrAsync_System_String_System_ReadOnlyMemory_System_Byte__NineP_Protocol_XattrFlags_System_Threading_CancellationToken_
  src: https://github.com/petar-stupar/9p-csharp/blob/main/src/NineP.Server/IXattrHandler.cs#L30
